<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Explore Incredible India</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#f5f7fb;
    color:#222;
}

header{
    background:linear-gradient(135deg,#ff7a00,#ff3d00);
    color:white;
    padding:30px 20px;
    text-align:center;
}

header h1{
    font-size:42px;
    margin-bottom:10px;
}

header p{
    font-size:18px;
    opacity:.95;
}

.search-box{
    max-width:900px;
    margin:25px auto;
    display:flex;
    gap:10px;
    padding:0 15px;
}

.search-box input{
    flex:1;
    padding:17px;
    border:none;
    border-radius:10px;
    font-size:17px;
    box-shadow:0 4px 15px rgba(0,0,0,.12);
}

.search-box button{
    padding:0 28px;
    border:none;
    border-radius:10px;
    background:#111827;
    color:white;
    font-size:16px;
    cursor:pointer;
}

.search-box button:hover{
    background:#000;
}

.suggestions{
    max-width:870px;
    margin:-18px auto 20px;
    background:white;
    border-radius:10px;
    box-shadow:0 5px 20px rgba(0,0,0,.15);
    overflow:hidden;
    display:none;
    position:relative;
    z-index:9999;
}

.suggestion{
    padding:13px 18px;
    cursor:pointer;
    border-bottom:1px solid #eee;
}

.suggestion:hover{
    background:#f3f4f6;
}

.suggestion small{
    color:#777;
    display:block;
    margin-top:3px;
}

.container{
    max-width:1400px;
    margin:auto;
    padding:20px;
}

.quick-title{
    text-align:center;
    margin-bottom:15px;
}

.quick-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:center;
    margin-bottom:25px;
}

.quick-buttons button{
    border:none;
    padding:10px 16px;
    border-radius:20px;
    background:white;
    box-shadow:0 3px 10px rgba(0,0,0,.1);
    cursor:pointer;
}

.quick-buttons button:hover{
    background:#ff7a00;
    color:white;
}

.info{
    background:white;
    padding:25px;
    border-radius:15px;
    margin-bottom:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.info h2{
    color:#ff5a00;
    margin-bottom:10px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-top:20px;
}

.stat{
    background:#f8fafc;
    padding:18px;
    text-align:center;
    border-radius:12px;
}

.stat strong{
    display:block;
    font-size:25px;
    color:#ff5a00;
}

.stat span{
    color:#666;
    font-size:14px;
}

.filters{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.filter{
    border:1px solid #ddd;
    padding:10px 18px;
    background:white;
    border-radius:20px;
    cursor:pointer;
}

.filter.active,
.filter:hover{
    background:#ff6500;
    color:white;
    border-color:#ff6500;
}

#map{
    height:500px;
    border-radius:15px;
    margin-bottom:30px;
    box-shadow:0 5px 20px rgba(0,0,0,.12);
}

.section-title{
    margin-bottom:20px;
}

.places{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:22px;
}

.card{
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 5px 18px rgba(0,0,0,.1);
    transition:.2s;
}

.card:hover{
    transform:translateY(-5px);
}

.card img{
    width:100%;
    height:200px;
    object-fit:cover;
    background:#eee;
}

.card-content{
    padding:18px;
}

.card h3{
    margin-bottom:8px;
    color:#222;
}

.badge{
    display:inline-block;
    background:#fff0e6;
    color:#ff5a00;
    padding:5px 9px;
    border-radius:12px;
    font-size:12px;
    margin-bottom:10px;
}

.card p{
    color:#666;
    line-height:1.5;
    font-size:14px;
}

.card-buttons{
    display:flex;
    gap:8px;
    margin-top:15px;
}

.card-buttons a,
.card-buttons button{
    flex:1;
    padding:10px;
    text-align:center;
    border:none;
    border-radius:8px;
    text-decoration:none;
    cursor:pointer;
    font-size:13px;
}

.view-map{
    background:#111827;
    color:white;
}

.wikipedia{
    background:#eee;
    color:#222;
}

.loading{
    text-align:center;
    padding:50px;
    color:#777;
    font-size:18px;
}

.error{
    background:#fff0f0;
    color:#b00020;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
}

footer{
    text-align:center;
    padding:30px;
    margin-top:40px;
    background:#111827;
    color:white;
}

@media(max-width:700px){
    header h1{
        font-size:30px;
    }

    .search-box{
        flex-direction:column;
    }

    .search-box button{
        padding:15px;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    #map{
        height:400px;
    }
}
</style>
</head>

<body>

<header>
    <h1>🇮🇳 Explore Incredible India</h1>
    <p>Search any State, Union Territory, City or Tourist Place</p>

    <div class="search-box">
        <input
            id="searchInput"
            type="text"
            placeholder="Search Gujarat, Rajasthan, Ahmedabad, Jaipur, Mumbai..."
            autocomplete="off"
        >
        <button onclick="searchLocation()">🔍 Search</button>
    </div>

    <div id="suggestions" class="suggestions"></div>
</header>

<div class="container">

    <h3 class="quick-title">Popular Searches</h3>

    <div class="quick-buttons" id="quickButtons"></div>

    <div id="mainInfo"></div>

    <div class="filters">
        <button class="filter active" onclick="filterPlaces('All',this)">All</button>
        <button class="filter" onclick="filterPlaces('Historical',this)">🏰 Historical</button>
        <button class="filter" onclick="filterPlaces('Religious',this)">🛕 Religious</button>
        <button class="filter" onclick="filterPlaces('Nature',this)">🌿 Nature</button>
        <button class="filter" onclick="filterPlaces('Beach',this)">🏖️ Beach</button>
        <button class="filter" onclick="filterPlaces('Wildlife',this)">🐅 Wildlife</button>
        <button class="filter" onclick="filterPlaces('Museum',this)">🏛️ Museum</button>
    </div>

    <div id="map"></div>

    <h2 class="section-title" id="placesTitle">
        Famous Places
    </h2>

    <div id="places" class="places"></div>

</div>

<footer>
    <p>🇮🇳 Incredible India Tourism Explorer</p>

        Maps: OpenStreetMap + Leaflet |
        Photos/Articles: Wikimedia Commons + Wikipedia |

    </p>
</footer>

/* =========================================================

   ========================================================= */

const searchInput = document.getElementById("searchInput");
const suggestions = document.getElementById("suggestions");

searchInput.addEventListener("input",function(){

    const value = this.value.trim().toLowerCase();

    if(!value){
        suggestions.style.display="none";
        return;
    }

    let results=[];

    Object.keys(regions).forEach(region=>{

        if(region.toLowerCase().includes(value)){

            results.push({
                name:region,
                type:regions[region].type,
                subtitle:
                    regions[region].type +
                    " • Capital: " +
                    regions[region].capital
            });
        }
    });

    Object.keys(popularCities).forEach(city=>{

        if(city.toLowerCase().includes(value)){

            const state=popularCities[city].state;

            results.push({
                name:city,
                type:"City",
                subtitle:"City • "+state
            });
        }
    });

    results=results.slice(0,15);

    if(results.length===0){
        suggestions.style.display="none";
        return;
    }

    suggestions.innerHTML=results.map(item=>`
        <div class="suggestion"
             onclick="selectSuggestion('${item.name.replace(/'/g,"\\'")}')">
            <strong>${item.name}</strong>
            <small>${item.subtitle}</small>
        </div>
    `).join("");

    suggestions.style.display="block";
});


function selectSuggestion(name){

    searchInput.value=name;
    suggestions.style.display="none";
    searchLocation();
}


document.addEventListener("click",function(e){

    if(!e.target.closest(".search-box") &&
       !e.target.closest(".suggestions")){

        suggestions.style.display="none";
    }
});


/* =========================================================
   MAIN SEARCH
   ========================================================= */

async function searchLocation(){

    const query=searchInput.value.trim();

    if(!query){
        return;
    }

    suggestions.style.display="none";

    /* State / UT exact search */
    const regionName=findRegion(query);

    if(regionName){

        loadState(regionName);
        return;
    }

    /* Popular city exact search */
    const cityName=findCity(query);

    if(cityName){

        const city=popularCities[cityName];

        await loadCity(
            cityName,
            city.state,
            city.lat,
            city.lng
        );

        return;
    }

    /* Any other Indian city */
    await searchUnknownIndianCity(query);
}


/* =========================================================
   FIND STATE
   ========================================================= */

function findRegion(query){

    const normalized=query.trim().toLowerCase();

    for(const name of Object.keys(regions)){

        if(name.toLowerCase()===normalized){
            return name;
        }
    }

    /* Common aliases */

    const aliases={
        "up":"Uttar Pradesh",
        "uttaranchal":"Uttarakhand",
        "mp":"Madhya Pradesh",
        "mh":"Maharashtra",
        "tn":"Tamil Nadu",
        "ap":"Andhra Pradesh",
        "ts":"Telangana",
        "wb":"West Bengal",
        "hp":"Himachal Pradesh",
        "jk":"Jammu and Kashmir",
        "j&k":"Jammu and Kashmir",
        "odisha":"Odisha",
        "orissa":"Odisha",
        "nct delhi":"Delhi",
        "jammu & kashmir":"Jammu and Kashmir",
        "ladakh":"Ladakh",
        "pondicherry":"Puducherry",
        "andaman":"Andaman and Nicobar Islands",
        "andaman and nicobar":"Andaman and Nicobar Islands"
    };

    return aliases[normalized] || null;
}


/* =========================================================
   FIND CITY
   ========================================================= */

function findCity(query){

    const normalized=query.trim().toLowerCase();

    for(const city of Object.keys(popularCities)){

        if(city.toLowerCase()===normalized){
            return city;
        }
    }

    return null;
}


/* =========================================================
   LOAD STATE
   ========================================================= */

async function loadState(regionName){

    currentMode="state";
    currentLocation=regionName;

    const region=regions[regionName];

    currentPlaces=region.places.map(p=>({

        name:p[0],
        category:p[1],
        lat:p[2],
        lng:p[3],
        description:
            "Famous tourist attraction in " +
            regionName +
            ", India."

    }));

    currentCategory="All";

    updateFilters();

    document.getElementById("mainInfo").innerHTML=`

        <div class="info">

            <h2>🇮🇳 ${regionName}</h2>

            <p>
                Explore famous tourist places, historical sites,
                religious destinations, beaches, nature spots and
                wildlife attractions in ${regionName}.
            </p>

            <div class="stats">

                <div class="stat">
                    <strong>${region.capital}</strong>
                    <span>Capital</span>
                </div>

                <div class="stat">
                    <strong>${region.cities.length}+</strong>
                    <span>Major Cities</span>
                </div>

                <div class="stat">
                    <strong>${region.places.length}</strong>
                    <span>Featured Places</span>
                </div>

                <div class="stat">
                    <strong>${region.type}</strong>
                    <span>Region Type</span>
                </div>

            </div>

        </div>
    `;

    document.getElementById("placesTitle").innerText=
        `Famous Places in ${regionName}`;

    renderMap(currentPlaces,region.places[0][2],region.places[0][3],6);

    await loadImagesForPlaces(currentPlaces);

    renderPlaces();
}


/* =========================================================
   LOAD CITY
   ========================================================= */

async function loadCity(city,state,lat,lng){

    currentMode="city";
    currentLocation=city;

    document.getElementById("mainInfo").innerHTML=`

        <div class="info">

            <h2>📍 ${city}</h2>

            <p>
                Famous places and tourist attractions in
                <strong>${city}</strong>, ${state}, India.
                The website automatically searches Wikipedia
                for nearby attractions.
            </p>

            <div class="stats">

                <div class="stat">
                    <strong>${city}</strong>
                    <span>City</span>
                </div>

                <div class="stat">
                    <strong>${state}</strong>
                    <span>State / UT</span>
                </div>

                <div class="stat">
                    <strong>India</strong>
                    <span>Country</span>
                </div>

                <div class="stat">
                    <strong>Live</strong>
                    <span>Place Search</span>
                </div>

            </div>

        </div>
    `;

    document.getElementById("placesTitle").innerText=
        `Famous Places in ${city}`;

    document.getElementById("places").innerHTML=
        `<div class="loading">🔎 Finding famous places around ${city}...</div>`;

    map.setView([lat,lng],11);

    clearMarkers();

    L.marker([lat,lng])
        .addTo(map)
        .bindPopup(`<b>${city}</b><br>${state}, India`)
        .openPopup();

    try{

        const url=
            "https://en.wikipedia.org/w/api.php?"+
            new URLSearchParams({

                action:"query",
                generator:"geosearch",
                ggscoord:`${lat}|${lng}`,
                ggsradius:"10000",
                ggslimit:"20",

                prop:"coordinates|pageimages|info",
                inprop:"url",

                piprop:"thumbnail",
                pithumbsize:"700",

                format:"json",
                origin:"*"

            });

        const response=await fetch(url);

        const data=await response.json();

        const pages=data.query?.pages || {};

        let places=Object.values(pages);

        places=places.filter(page=>{

            const title=page.title.toLowerCase();

            return !title.includes("list of") &&
                   title!==city.toLowerCase();

        });

        places=places.slice(0,12);

        currentPlaces=places.map(page=>{

            const coordinate=
                page.coordinates &&
                page.coordinates[0];

            return {

                name:page.title,

                category:inferCategory(page.title),

                lat:coordinate
                    ? coordinate.lat
                    : lat,

                lng:coordinate
                    ? coordinate.lon
                    : lng,

                description:
                    `Famous place or attraction near ${city}.`,

                image:
                    page.thumbnail
                    ? page.thumbnail.source
                    : placeholderImage(page.title),

                wiki:
                    page.fullurl ||
                    `https://en.wikipedia.org/wiki/${encodeURIComponent(page.title)}`
            };

        });

        if(currentPlaces.length===0){

            currentPlaces=[{
                name:city,
                category:"City",
                lat:lat,
                lng:lng,
                description:`Explore ${city}, ${state}, India.`,
                image:placeholderImage(city),
                wiki:`https://en.wikipedia.org/wiki/${encodeURIComponent(city)}`
            }];
        }

        currentCategory="All";

        updateFilters();

        renderMap(
            currentPlaces,
            lat,
            lng,
            11
        );

        renderPlaces();

    }catch(error){

        console.error(error);

        document.getElementById("places").innerHTML=`

            <div class="error">
                Unable to load city attractions right now.
                Please check your internet connection and try again.
            </div>

        `;
    }
}


/* =========================================================
   UNKNOWN CITY SEARCH
   This makes the search work for many cities not manually
   added to popularCities.
   ========================================================= */

async function searchUnknownIndianCity(cityName){

    document.getElementById("mainInfo").innerHTML=`
        <div class="info">
            <div class="loading">
                🌍 Searching India for "${cityName}"...
            </div>
        </div>
    `;

    document.getElementById("places").innerHTML="";

    try{

        const url=
            "https://nominatim.openstreetmap.org/search?"+
            new URLSearchParams({

                q:`${cityName}, India`,
                format:"jsonv2",
                addressdetails:"1",
                limit:"5",
                countrycodes:"in"

            });

        const response=await fetch(url,{
            headers:{
                "Accept-Language":"en"
            }
        });

        const results=await response.json();

        if(!results.length){

            document.getElementById("mainInfo").innerHTML=`

                <div class="error">
                    ❌ City not found.
                    Try a city such as Ahmedabad, Jaipur,
                    Mumbai, Delhi, Surat, Pune, Agra or Varanasi.
                </div>

            `;

            return;
        }

        let selected=results.find(item=>{

            return [
                "city",
                "town",
                "municipality",
                "village"
            ].includes(item.type);

        }) || results[0];

        const lat=parseFloat(selected.lat);
        const lng=parseFloat(selected.lon);

        const address=selected.address || {};

        const state=
            address.state ||
            address.region ||
            "India";

        const properCity=
            address.city ||
            address.town ||
            address.municipality ||
            address.village ||
            selected.display_name.split(",")[0];

        await loadCity(
            properCity,
            state,
            lat,
            lng
        );

    }catch(error){

        console.error(error);

        document.getElementById("mainInfo").innerHTML=`

            <div class="error">
                ❌ Could not search this city.
                Please check your internet connection.
            </div>
        `;
    }
}


/* =========================================================
   CATEGORY CLASSIFICATION
   ========================================================= */

function inferCategory(title){

    const text=title.toLowerCase();

    if(
        text.includes("temple") ||
        text.includes("mosque") ||
        text.includes("church") ||
        text.includes("gurdwara") ||
        text.includes("monastery") ||
        text.includes("shrine") ||
        text.includes("ashram")
    ){
        return "Religious";
    }

    if(
        text.includes("beach") ||
        text.includes("coast") ||
        text.includes("marina")
    ){
        return "Beach";
    }

    if(
        text.includes("national park") ||
        text.includes("wildlife") ||
        text.includes("sanctuary") ||
        text.includes("zoo")
    ){
        return "Wildlife";
    }

    if(
        text.includes("museum")
    ){
        return "Museum";
    }

    if(
        text.includes("lake") ||
        text.includes("waterfall") ||
        text.includes("falls") ||
        text.includes("valley") ||
        text.includes("hill") ||
        text.includes("mount") ||
        text.includes("garden") ||
        text.includes("park") ||
        text.includes("island")
    ){
        return "Nature";
    }

    return "Historical";
}


/* =========================================================
   MAP
   ========================================================= */

function renderMap(places,centerLat,centerLng,zoom){

    clearMarkers();

    map.setView(
        [centerLat,centerLng],
        zoom
    );

    places.forEach(place=>{

        if(
            typeof place.lat!=="number" ||
            typeof place.lng!=="number"
        ){
            return;
        }

        const marker=L.marker([
            place.lat,
            place.lng
        ]).addTo(map);

        marker.bindPopup(`

            <div style="min-width:180px">

                <strong>${place.name}</strong>

                <br>

                <span style="color:#ff5a00">
                    ${place.category}
                </span>

                <br><br>

                <button
                    onclick="focusPlace(${place.lat},${place.lng})"
                    style="
                    padding:7px 12px;
                    border:0;
                    background:#ff6500;
                    color:white;
                    border-radius:6px;
                    cursor:pointer;">
                    View on Map
                </button>

            </div>

        `);

        markers.push(marker);
    });
}


function clearMarkers(){

    markers.forEach(marker=>{
        map.removeLayer(marker);
    });

    markers=[];
}


function focusPlace(lat,lng){

    map.setView(
        [lat,lng],
        15
    );

    window.scrollTo({
        top:document.getElementById("map").offsetTop-80,
        behavior:"smooth"
    });
}


/* =========================================================
   IMAGES FOR STATE PLACES
   ========================================================= */

async function loadImagesForPlaces(places){

    await Promise.all(

        places.map(async place=>{

            if(place.image){
                return;
            }

            try{

                const url=
                    "https://commons.wikimedia.org/w/api.php?"+
                    new URLSearchParams({

                        action:"query",
                        generator:"search",

                        gsrsearch:
                            `${place.name} India`,

                        gsrnamespace:"6",
                        gsrlimit:"1",

                        prop:"imageinfo",
                        iiprop:"url",

                        format:"json",
                        origin:"*"

                    });

                const response=await fetch(url);

                const data=await response.json();

                const pages=
                    data.query?.pages || {};

                const first=
                    Object.values(pages)[0];

                if(
                    first &&
                    first.imageinfo &&
                    first.imageinfo[0]
                ){

                    place.image=
                        first.imageinfo[0].url;

                }else{

                    place.image=
                        placeholderImage(place.name);
                }

            }catch(error){

                place.image=
                    placeholderImage(place.name);
            }

        })
    );
}


/* =========================================================
   PLACEHOLDER
   ========================================================= */

function placeholderImage(text){

    return "https://placehold.co/800x500?text="+
        encodeURIComponent(text);
}


/* =========================================================
   FILTER
   ========================================================= */

function filterPlaces(category,button){

    currentCategory=category;

    document.querySelectorAll(".filter")
        .forEach(btn=>{
            btn.classList.remove("active");
        });

    if(button){
        button.classList.add("active");
    }

    renderPlaces();
}


function updateFilters(){

    document.querySelectorAll(".filter")
        .forEach(btn=>{
            btn.classList.remove("active");
        });

    const first=
        document.querySelector(".filter");

    if(first){
        first.classList.add("active");
    }
}


/* =========================================================
   RENDER CARDS
   ========================================================= */

function renderPlaces(){

    let filtered=currentPlaces;

    if(currentCategory!=="All"){

        filtered=currentPlaces.filter(place=>
            place.category===currentCategory
        );
    }

    const container=
        document.getElementById("places");

    if(!filtered.length){

        container.innerHTML=`

            <div class="loading">
                No places found in this category.
            </div>

        `;

        return;
    }

    container.innerHTML=filtered.map((place,index)=>{

        const image=
            place.image ||
            placeholderImage(place.name);

        const wiki=
            place.wiki ||
            `https://en.wikipedia.org/wiki/${
                encodeURIComponent(place.name)
            }`;

        return `

        <div class="card">

            <img
                src="${image}"
                alt="${place.name}"
                loading="lazy"
                onerror="this.src='${placeholderImage(place.name)}'"
            >

            <div class="card-content">

                <span class="badge">
                    ${place.category}
                </span>

                <h3>${place.name}</h3>

                <p>
                    ${place.description}
                </p>

                <div class="card-buttons">

                    <button
                        class="view-map"
                        onclick="
                            focusPlace(
                                ${place.lat},
                                ${place.lng}
                            )
                        ">
                        📍 Map
                    </button>

                    <a
                        class="wikipedia"
                        href="${wiki}"
                        target="_blank"
                        rel="noopener">
                        📖 Details
                    </a>

                </div>

            </div>

        </div>

        `;

    }).join("");

}
